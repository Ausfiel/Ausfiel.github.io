    <script>

function min(a, b) {
    if (a < b) {
        return a;
    } else {
        return b;
    }
}

let firstNumber = prompt("Введите первое число:");
let secondNumber = prompt("Введите второе число:");

let num1 = parseFloat(firstNumber);
let num2 = parseFloat(secondNumber);

let result = min(num1, num2);

alert("Минимальное число: " + result);

console.log("Первое: " + num1 + ", Второе: " + num2 + ", Минимум: " + result);
    </script>

<script>
    let userAge;
    let confirmed = false;
    
    do {
        userAge = prompt("Сколько вам лет?");
        if (userAge === null) {
            continue;
        }
        userAge = Number(userAge);
        if (!isNaN(userAge)) {
            // Уточняем
            let answer = confirm("Вы уверены, что вам " + userAge + " лет?");
            if (answer === true) {
                confirmed = true;
            }
        }
    } while (userAge === null || isNaN(userAge) || !confirmed);
    
    alert("Спасибо! Вам " + userAge + " лет.");
</script>

    <!-- ДАЛЕЕ ДОБАВЛЯЕМ РЕЗЮМЕ -->

    <div class="resume">
        <h2>Моё резюме</h2>
        
        <!-- Фото (заглушка) -->
        <img class="photo" src="e823e08eb26ea8cdb30f4174bebcebc7.jpg" alt="Фото">
        
        <p><strong>Имя:</strong> Станислав</p>
        <p><strong>Фамилия:</strong> <span id="lastName" class="surname">Наумов</span></p>
        
        <!-- Поле ввода для новой фамилии -->
        <input type="text" id="newSurname" placeholder="Введите новую фамилию">
        
        <!-- Кнопка для изменения фамилии -->
        <button id="changeSurnameBtn">Изменить фамилию</button>
        
        <!-- Кнопка для рандомного фона -->
        <button id="randomBgBtn">Случайный фон страницы</button>
    </div>

    <script>
    
        const changeBtn = document.getElementById('changeSurnameBtn');
        const surnameSpan = document.getElementById('lastName');
        const surnameInput = document.getElementById('newSurname');
        
        changeBtn.addEventListener('click', function() {
            let newSurname = surnameInput.value.trim();
            if (newSurname !== "") {
                surnameSpan.textContent = newSurname;
                surnameInput.value = ""; // очищаем поле
            } else {
                alert("Введите фамилию!");
            }
        });
        

        const randomBtn = document.getElementById('randomBgBtn');
        randomBtn.addEventListener('click', function() {
            // Генерируем случайный цвет
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = randomColor;
        });
    </script>
